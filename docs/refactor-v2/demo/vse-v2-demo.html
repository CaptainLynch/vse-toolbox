<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSE Toolbox v2 Demo</title>
<style>
:root{
  --bg:#efe9df; --win:#f8f4ee; --surface:#fffdf9; --line:#e6ddd1; --line2:#d8ccbd;
  --ink:#2b2622; --muted:#7a6f66; --faint:#a39a90;
  --accent:#c4673f; --accent-ink:#fff; --accent-soft:#f6e3d9;
  --ok:#2f8a5b; --ok-soft:#e1f1e7; --warn:#a8740f; --warn-soft:#f8ecd2;
  --bad:#c2463d; --bad-soft:#f8e0dd; --off:#8d877f; --off-soft:#ece8e2;
  --info:#3d6fb0; --info-soft:#e2ebf6;
  --radius:12px; --shadow:0 10px 30px rgba(60,40,20,.12);
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
/* ── window frame ── */
.desk{min-height:100%;padding:18px 16px 70px;display:flex;justify-content:center}
.win{width:100%;max-width:1240px;background:var(--win);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 88px);border:1px solid var(--line2)}
.win.hidden{display:none}
.titlebar{height:36px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;background:#f1ebe2;border-bottom:1px solid var(--line);user-select:none}
.titlebar .ttl{font-size:12.5px;color:var(--muted);flex:1}
.titlebar .wbtn{width:40px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--muted)}
.titlebar .wbtn:hover{background:#e7dfd3}
.titlebar .wbtn.close:hover{background:var(--bad);color:#fff}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
/* ── top bar ── */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.proj{display:flex;align-items:center;gap:8px;position:relative}
.proj-btn{border:1px solid var(--line2);background:var(--win);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-weight:600}
.proj-btn small{font-weight:400;color:var(--muted)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:240px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:30}
.menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;gap:8px;align-items:center}
.menu button:hover{background:var(--accent-soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
nav.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:600}
nav.tabs button:hover{background:var(--win);color:var(--ink)}
nav.tabs button.on{background:var(--accent);color:#fff}
.right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.off{background:var(--off-soft);color:var(--off)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.nodot::before{display:none}
.iconbtn{border:1px solid var(--line2);background:var(--win);border-radius:9px;padding:6px 11px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
/* ── layout ── */
main{flex:1;padding:22px 24px 40px;overflow:auto}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0} h3{font-size:14.5px;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.todo{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none}
.todo .body{flex:1;min-width:0}
.tone-ok .ic{background:var(--ok-soft)} .tone-warn .ic{background:var(--warn-soft)} .tone-bad .ic{background:var(--bad-soft)} .tone-info .ic{background:var(--info-soft)}
.errcard{border:1px solid #efc4bf;background:#fdf5f4;border-radius:10px;padding:14px}
.errcard dl{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:8px 0 12px}
.errcard dt{color:var(--muted)} .errcard dd{margin:0}
/* timeline */
.tl{display:flex;gap:0;overflow-x:auto;padding:8px 2px 4px}
.node{flex:1;min-width:92px;text-align:center;position:relative;padding-top:22px}
.node::before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line2)}
.node:first-child::before{left:50%} .node:last-child::before{right:50%}
.node .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line2);z-index:1}
.node.done .dot{background:var(--ok);border-color:var(--ok)} .node.done::before{background:var(--ok)}
.node.cur .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node.late .dot{border-color:var(--bad)}
.node b{display:block;font-size:12.5px} .node span{font-size:11.5px;color:var(--muted)}
.progress{height:8px;background:var(--off-soft);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.progress.ok>i{background:var(--ok)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);background:#faf6f0;font-weight:600;cursor:default}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:#fbf6ef}
mark{background:#fde9a9;border-radius:3px;padding:0 1px}
/* forms */
label.f{display:grid;gap:5px;margin-bottom:12px}
label.f>span{font-weight:600;font-size:13px}
label.f>em{font-style:normal;color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:#8f4524;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch i{width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{background:var(--ok)} .switch.on i::after{left:19px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px}
.seg button.on{background:var(--accent);color:#fff}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--accent);border-color:var(--accent)}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--muted);background:#fbf8f3}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.expert{border-left:3px solid var(--info);padding-left:12px}
.tag-expert{font-size:11px;color:var(--info);background:var(--info-soft);border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600}
/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(43,38,34,.32);z-index:40;display:flex}
.drawer{margin-left:auto;width:min(720px,100%);height:100%;background:var(--win);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .content{padding:18px 20px;overflow:auto;flex:1}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.modal{margin:auto;width:min(560px,calc(100% - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:22px;max-height:calc(100% - 40px);overflow:auto;animation:pop .18s ease}
.modal.wide{width:min(760px,calc(100% - 32px))}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
/* skeleton */
.sk{background:linear-gradient(90deg,#eee6db 25%,#f6f0e8 50%,#eee6db 75%);background-size:200% 100%;animation:sh 1s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
/* tray + toasts */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:44px;background:#24211f;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:10px;z-index:20;color:#ddd;font-size:12px}
.tray{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;cursor:pointer;position:relative}
.tray:hover{background:#3a3633}
.tray .logo{width:20px;height:20px;font-size:11px}
.tray-menu{position:fixed;right:70px;bottom:50px;background:#2f2b28;color:#eee;border-radius:8px;padding:6px;min-width:190px;z-index:60;box-shadow:var(--shadow)}
.tray-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#eee;padding:8px 12px;border-radius:6px}
.tray-menu button:hover{background:#45403c}
.toasts{position:fixed;right:14px;bottom:54px;display:flex;flex-direction:column;gap:8px;z-index:70;width:min(360px,calc(100% - 28px))}
.toast{background:#2f2b28;color:#f2eee9;border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);animation:pop .2s ease}
.toast b{display:block;margin-bottom:2px}
.toast .row{margin-top:8px}
.toast .btn{background:#45403c;border-color:#5a544f;color:#fff}
.toast .btn.primary{background:var(--accent);border-color:var(--accent)}
.clock{opacity:.8}
/* demo console */
.demo{position:fixed;left:12px;bottom:52px;z-index:65;background:#fff;border:1px solid var(--info);border-radius:10px;box-shadow:var(--shadow);width:250px;font-size:12.5px}
.demo summary{padding:8px 12px;cursor:pointer;color:var(--info);font-weight:700;list-style:none}
.demo .in{padding:0 10px 10px;display:grid;gap:6px}
.demo button{border:1px solid var(--line2);background:#fafafa;border-radius:7px;padding:5px 8px;text-align:left}
.demo button:hover{border-color:var(--info)}
.splash{position:fixed;inset:0;background:var(--win);z-index:90;display:grid;place-items:center;text-align:center}
.splash .logo{width:64px;height:64px;font-size:32px;border-radius:16px;margin:0 auto 14px}
.bar{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.bar>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.bar>div>i{width:100%;max-width:38px;border-radius:5px 5px 0 0;background:var(--accent);display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mailbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13.5px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.empty{text-align:center;color:var(--muted);padding:26px}
.split{grid-template-columns:minmax(0,2fr) minmax(260px,1fr);align-items:start}
.split.split-l{grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
@media (max-width:900px){ .split,.split.split-l{grid-template-columns:minmax(0,1fr)} }
@media (max-width:720px){
  .todo{flex-wrap:wrap} .todo .body{flex-basis:calc(100% - 50px)}
  .demo{width:auto;right:12px}
  .desk{padding:0 0 50px} .win{border-radius:0;min-height:calc(100vh - 44px)}
  main{padding:16px} .top{padding:10px 16px}
  .errcard dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="desk"><div class="win" id="win"></div></div>
<div class="taskbar">
  <span class="faint" style="margin-right:auto;color:#999">演示：底部为模拟的 Windows 任务栏，右侧是托盘图标</span>
  <div class="tray" id="tray" title="VSE Toolbox"><span class="logo">V</span></div>
  <span class="clock">10-28 星期三</span>
</div>
<div class="toasts" id="toasts"></div>
<div id="layer"></div>
<details class="demo" id="demo"><summary>🧪 演示控制台</summary><div class="in">
  <button data-act="demo-reset">↺ 重置为首次安装</button>
  <button data-act="demo-expire">模拟：登录过期</button>
  <button data-act="demo-discover">模拟：下载文件夹里出现更新包</button>
  <button data-act="demo-badupdate">模拟：安装一个会启动失败的更新</button>
  <button data-act="demo-syncfail">模拟：NCR 同步失败</button>
  <span class="faint">数据均为本地假数据，刷新页面会保留进度。</span>
</div></details>

<script>
"use strict";
/* ═════════════ 假数据与状态 ═════════════ */
const TODAY = "2026-10-28";
const SECTIONS = ["车体科","车身科","内饰科","外饰科","车体架构集成科","底盘科","电子电器科"]; // 前 5 个是 M0 问卷 C2 的默认科室
const VEHICLES = "E112C CF710V F610M 无人物流 E262S F412S F710C EQ100R-MCE N300L N300P N300PPS迭代 N510M CN110V N001 310S 310C E260S-PLUS F520M F520MR F510C F710S CF710P E261 E261MCE CF510V EQ100R E260R F510S E262C F610S F611S CF510P F520S F520SR E110C F620S CE110M N350V CF810P E261S-PLUS F720S".split(" ").map(v=>v.replace(/-/g," "));
const PLATFORMS = ["Ar-L","Ar-N","Ar-C","Ar-S","Ar-D","Ar-M"];
const DELIV_TEMPLATES = [
  {key:"sor", name:"SOR 定点流程", source:"TDC", plan:"2026-11-20"},
  {key:"ewo", name:"EWO 工程变更", source:"Aras", plan:"2026-11-05"},
  {key:"dm",  name:"数模设计审核", source:"TDC", plan:"2026-10-24"},
  {key:"paa", name:"PAA 流程", source:"Aras", plan:"2026-12-10"},
  {key:"ncrp",name:"NCR 审批进度", source:"Aras", plan:"2026-11-15"},
  {key:"ncrd",name:"NCR 审批明细", source:"Aras", plan:"2026-11-15"},
];
const PHASES = [
  ["VPI","2026-04-08"],["内饰模型评审","2026-05-10"],["外饰模型评审","2026-05-28"],["LLP VDR","2026-06-20"],
  ["100% VDR","2026-07-15"],["LLP T2","2026-08-10"],["100% T2","2026-09-20"],["OTS","2026-11-10"],
  ["验证阀","2026-12-15"],["内部体验阀",""],["用户体验阀",""]
];
function mkProject(code, sections, pick){
  return {
    id: code, code, name: code + " 项目", sections: sections.slice(),
    phases: PHASES.map(([n,d],i)=>({name:n, date:d, done: d && d < TODAY && i<7})),
    deliverables: DELIV_TEMPLATES.filter(t=>!pick || pick.includes(t.key)).map((t,i)=>({
      ...t, id: code+"-"+t.key, enabled:false, verified:false, progress:null, lastRun:null, error:null,
      filter:{vehicles:[code], sections: sections.slice(), from:"2026-01-01", to:""}, mode:"自动",
    })),
  };
}
function seed(){
  return {
    v:3, firstRun:true, loggedIn:false, user:"", savePwd:true, autostart:false, expert:false,
    page:"today", sub:{}, projects:[], cur:null, tasks:[], watch:["DM-20261007","DM-20261012"],
    sessionExpired:false, lastBg:null, reportDone:false, lowVis:false, discoverOn:true,
    version:{app:"2.0.3", packs:{"项目与交付物":"2.0.3","签署日报":"0.3.0","TIR 简表":"0.2.1","Excel 工具":"0.2.0","自动归档":"0.2.0"}, runtime:"rt-2026.11 (Python 3.12)"},
    history:[{t:"10-20 09:12", text:"安装 VSE Toolbox 2.0.3", tone:"ok"}],
    archive:[
      {id:1,name:"EWO 报表每日留存",on:true,freq:"每天 07:00",last:"今天 07:00 ✓",dir:"默认目录"},
      {id:2,name:"NCR 审批明细每日留存",on:true,freq:"每天 07:10",last:"今天 07:10 ✓",dir:"默认目录"},
      {id:3,name:"数模审核流程周留存",on:false,freq:"每周一 08:00",last:"未运行",dir:"默认目录"},
    ],
    rollup:[["结构工程科","车身科"],["车门附件科","车身科"],["BE 结构工程科","车身科"],["内外饰工程科","内饰科"]],
  };
}
let S;
try { S = JSON.parse(localStorage.getItem("vse-v2-demo")||"null"); } catch(e){ S=null; }
if(!S || S.v!==3) S = seed();
function save(){ try{ localStorage.setItem("vse-v2-demo", JSON.stringify(S)); }catch(e){} }
const P = () => S.projects.find(p=>p.id===S.cur);

/* 交付物数据行（数模） */
function rng(seedN){ let x=seedN; return ()=> (x = (x*9301+49297)%233280)/233280; }
function dmRows(code){
  const r=rng(code.split("").reduce((a,c)=>a+c.charCodeAt(0),0));
  const parts=["前保险杠骨架","仪表板横梁","左前门内板","后背门外板","顶棚总成","中控台面板","座椅骨架","前副车架","线束支架","尾灯安装座","A 柱上饰板","发舱盖铰链"];
  const people=[["张伟","车身科"],["李娜","内饰科"],["王强","外饰科"],["刘洋","底盘科"],["陈静","车体科"],["赵磊","车身科"],["孙敏","内饰科"],["周杰","车体架构集成科"]];
  const st=["审批中","审批中","审批中","已签署","已签署","退回修改"];
  return Array.from({length:42},(_,i)=>{
    const p=people[Math.floor(r()*people.length)];
    const s=st[Math.floor(r()*st.length)];
    const plat = r()<.18;
    return {no:"DM-2026"+String(1001+i*7).padStart(4,"0").slice(-4)+String(10+i).slice(-2), part:parts[Math.floor(r()*parts.length)],
      veh: plat ? (r()<.5?"Ar-L":"Ar-L+") : code, sec:p[1], who:p[0], st:s, days: s==="已签署"?0:Math.floor(r()*38)+1};
  });
}

/* ═════════════ 唯一的状态口径（C4/C5） ═════════════ */
function delivStatus(d){
  if(!d.enabled) return {tone:"off", label:"未开启同步", late:0};
  if(d.error) return {tone:"bad", label:"同步失败", late:0};
  if(!d.verified) return {tone:"info", label:"首次同步中", late:0};
  const late = daysBetween(d.plan, TODAY);
  if(d.progress>=100) return {tone:"ok", label:"已完成", late:0};
  if(late>0) return {tone:"bad", label:`已逾期 ${late} 天`, late};
  if(daysBetween(TODAY,d.plan)<=7) return {tone:"warn", label:"7 天内到期", late:0};
  return {tone:"ok", label:"正常", late:0};
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/864e5); }
function overall(p){
  const have=p.deliverables.filter(d=>d.enabled&&d.verified&&!d.error);
  if(!have.length) return {pct:null, n:0, m:p.deliverables.length};
  return {pct:Math.round(have.reduce((a,d)=>a+d.progress,0)/have.length), n:have.length, m:p.deliverables.length};
}
function fakeProgress(d){
  const base={sor:72,ewo:58,dm:64,paa:35,ncrp:81,ncrd:81}[d.key]??50;
  return base;
}

/* ═════════════ 工具函数 ═════════════ */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = (tone,text,extra="") => `<span class="pill ${tone} ${extra}">${esc(text)}</span>`;
function nowStr(){ const d=new Date(); return `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function toast(title, text="", actions=[] , ms=5200){
  const el=document.createElement("div"); el.className="toast";
  el.innerHTML=`<b>${esc(title)}</b><div class="small" style="opacity:.85">${esc(text)}</div>${actions.length?`<div class="row">${actions.map((a,i)=>`<button class="btn sm ${i===0?"primary":""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div>`:""}`;
  el.addEventListener("click",e=>{const b=e.target.closest("button[data-i]"); if(b){ actions[+b.dataset.i].run(); el.remove(); }});
  $("#toasts").appendChild(el); setTimeout(()=>el.remove(), actions.length? ms*2: ms);
}
function addTask(name, ms, onDone, kind="下载"){
  const t={id:Date.now()+Math.random(), name, pct:0, state:"运行中", kind, file:null};
  S.tasks.unshift(t); render();
  const step=()=>{ if(t.state!=="运行中") return;
    t.pct=Math.min(100,t.pct+17+Math.floor(Math.random()*8)); // 约 5–6 步完成，耗时接近 ms
    if(t.pct>=100){ t.state="已完成"; const r=onDone&&onDone(t); if(r) t.file=r; save(); }
    else setTimeout(step, ms/6);
    refreshLive();
  };
  setTimeout(step, ms/6); return t;
}
function refreshLive(){ // 轻量刷新：任务徽章与打开的任务抽屉
  const b=$("#taskBadge"); const n=S.tasks.filter(t=>t.state==="运行中").length;
  if(b){ b.textContent=n; b.style.display=n?"grid":"none"; }
  if(layer.kind==="tasks") openTasks();
  document.querySelectorAll("[data-live-task]").forEach(el=>{ const t=S.tasks.find(x=>String(x.id)===el.dataset.liveTask); if(t) el.innerHTML=taskInline(t); });
}
function taskInline(t){
  return t.state==="运行中" ? `<div class="row small"><span class="muted">${esc(t.name)}…</span><span class="spacer"></span>${t.pct}%</div><div class="progress"><i style="width:${t.pct}%"></i></div>`
    : `<div class="row small">${pill("ok","已完成")}<span>${esc(t.name)}</span><span class="spacer"></span>${t.file?`<button class="btn sm" data-act="open-file" data-file="${esc(t.file)}">打开文件</button>`:""}</div>`;
}

/* ═════════════ 事件 ═════════════ */
document.addEventListener("click", e=>{
  const stop=e.target.closest("[data-stop]");
  const el=e.target.closest("[data-act]");
  if(!el){ if(menuOpen && !e.target.closest(".proj")){ menuOpen=false; render(); } if(trayMenu && !e.target.closest(".tray-menu,#tray")) closeTray(); return; }
  // 点在抽屉/弹窗内部的空白处时，最近的 data-act 是外层遮罩，不能当成"关闭"
  if(el.dataset.act==="close-layer" && stop && !el.matches("button")) return;
  if(el.tagName==="A") e.preventDefault();
  const [act,arg]=el.dataset.act.split(/:(.*)/s);
  const p=P();
  switch(act){
    case "nav": go(el.dataset.page); break;
    case "nav-project": closeLayer(); go("project"); break;
    case "nav-report": go("reports","sign"); break;
    case "proj-menu": menuOpen=!menuOpen; render(); break;
    case "proj-switch": S.cur=el.dataset.id; signSel=null; signOut=null; menuOpen=false; go(S.page); toast("已切换项目", `现在查看 ${S.cur}`); break;
    case "proj-new": menuOpen=false; render(); openNewProject(false); break;
    case "proj-edit": openNewProject(true); break;
    case "np-sec": { const s=layer.secs; const i=s.indexOf(arg); i>=0?s.splice(i,1):s.push(arg); el.classList.toggle("on"); break; }
    case "np-create": { const code=($("#npCode").value||"").trim().toUpperCase(); if(!code){ $("#npCode").focus(); break; }
      if(S.projects.find(x=>x.id===code)){ toast("项目已存在", code); break; }
      const np=mkProject(code, layer.secs); S.projects.push(np); S.cur=code; closeLayer(); go("project"); np.deliverables.forEach((d,i)=>setTimeout(()=>enableDeliv(d),i*400)); toast("项目已创建", `正在为 ${code} 首次同步`); break; }
    case "np-save": p.sections=layer.secs.slice(); closeLayer(); render(); toast("已保存","下一次同步起按新科室统计"); break;
    case "session": S.sessionExpired? openLogin() : go("settings","account"); break;
    case "tasks": openTasks(); break;
    case "close-layer": if(layer.kind!=="wizard") closeLayer(); break;
    case "win-close": S.hidden=true; render(); toast("VSE Toolbox 仍在后台运行","会按时同步数据。点击右下角托盘图标可以重新打开。"); break;
    case "win-min": S.hidden=true; render(); break;
    case "enable-all": p.deliverables.filter(d=>!d.enabled).forEach((d,i)=>setTimeout(()=>enableDeliv(d),i*350)); toast("已全部开启","系统按项目的车型和科室自动填好了条件，正在首次同步。"); break;
    case "enable-one": { const d=p.deliverables.find(x=>x.id===arg); enableDeliv(d); if(layer.kind==="deliv") setTimeout(()=>openDeliv(arg,"data"),50); break; }
    case "disable-sync": { const d=p.deliverables.find(x=>x.id===arg); d.enabled=false; d.verified=false; render(); openDeliv(arg,"sync"); break; }
    case "save-sync": toast("已保存","从下一次同步开始生效；正在进行的同步不受影响。"); break;
    case "sync-now": addTask("同步全部交付物",2400,()=>{ S.lastBg=nowStr(); p.deliverables.forEach(d=>{ if(d.enabled&&!d.error) d.lastRun=nowStr(); }); render(); toast("同步完成","没有发现异常"); },"同步"); break;
    case "retry-sync": { const d=p.deliverables.find(x=>x.id===arg); d.error=null; d.verified=false; render(); addTask(`重试同步：${d.name}`,1800,()=>{ d.verified=true; d.lastRun=nowStr(); render(); toast("重试成功", d.name); }); break; }
    case "open-deliv": gridState={q:"",sort:null,dir:1,page:0,onlyWatch:false}; openDeliv(arg,"data"); break;
    case "deliv-tab": layer.tab=arg; openDeliv(layer.id, arg); break;
    case "grid-sort": if(gridState.sort===arg) gridState.dir*=-1; else { gridState.sort=arg; gridState.dir=1; } openDeliv(layer.id); break;
    case "grid-page": gridState.page+=+arg; openDeliv(layer.id); break;
    case "grid-watch": gridState.onlyWatch=!gridState.onlyWatch; gridState.page=0; openDeliv(layer.id); break;
    case "f-veh": case "f-sec": { const d=p.deliverables.find(x=>x.id===layer.id); const list=act==="f-veh"?d.filter.vehicles:d.filter.sections; const i=list.indexOf(arg); i>=0?list.splice(i,1):list.push(arg); openDeliv(layer.id,"sync"); break; }
    case "f-mode": { const d=p.deliverables.find(x=>x.id===layer.id); d.mode=arg; openDeliv(layer.id,"sync"); break; }
    case "export-deliv": addTask("导出交付物数据",1600,()=>`${p.code}_数模审核_${TODAY}.xlsx`); toast("已在后台导出","完成后可以在「任务」里打开"); break;
    case "copy": toast("已复制单号", arg, [], 1800); break;
    case "toggle-sw": el.classList.toggle("on"); { const sp=el.querySelector("span"); if(sp) sp.textContent=el.classList.contains("on")?"已关联":"未关联"; } break;
    case "plan-edit": openPlanEdit(); break;
    case "plan-save": document.querySelectorAll("[data-plan]").forEach(i=>p.phases[+i.dataset.plan].date=i.value); document.querySelectorAll("[data-plandone]").forEach(i=>p.phases[+i.dataset.plandone].done=i.checked); closeLayer(); render(); toast("主计划已保存"); break;
    case "rep-tab": S.sub.reports=arg; render(); break;
    case "s-veh": case "s-sec": { const list=act==="s-veh"?signSel.veh:signSel.sec; const i=list.indexOf(arg); i>=0?list.splice(i,1):list.push(arg); render(); break; }
    case "s-watch": signSel.watch=!signSel.watch; render(); break;
    case "watch-edit": openWatch(); break;
    case "watch-add": { const v=($("#wIn").value||"").split(/[\s,，]+/).filter(Boolean); S.watch.push(...v); openWatch(); break; }
    case "watch-rm": S.watch.splice(+arg,1); openWatch(); break;
    case "quick-report": go("reports","sign"); setTimeout(()=>runSign(true),400); break;
    case "sign-gen": runSign(true); break;
    case "sign-gen-cached": runSign(false); break;
    case "copy-mail": toast("正文已复制","可以直接粘贴到邮件或聊天窗口里（图表为图片）"); S.reportDone=true; save(); break;
    case "eml": toast("已生成 Outlook 邮件草稿","收件人按通讯录自动填好，打开后检查一下就可以发送",[{label:"打开草稿",run:()=>toast("（演示）已打开 Outlook")}]); S.reportDone=true; save(); break;
    case "rep-settings": openRepSettings(); break;
    case "daily-auto": S.dailyAuto=!S.dailyAuto; render(); break;
    case "tir-run": { const t=addTask(`TIR 数据简表 ${p.code}`,2600,()=>{ toast("TIR 数据简表已导出","",[{label:"打开文件",run:()=>toast("（演示）已用 Excel 打开")}]); return `TIR数据简表_${p.code}_20261028.xlsx`; }); tirTaskId=String(t.id); render(); break; }
    case "tir-auto": S.tirAuto=!S.tirAuto; render(); break;
    case "export-run": { const name=$("#expSel").value; const t=addTask(`导出 ${name}`,3000,()=>{ toast("导出完成",name,[{label:"打开文件",run:()=>toast("（演示）已用 Excel 打开")}]); return `${name}_${p.code}.xlsx`; }); expTaskId=String(t.id); render(); break; }
    case "ewo-run": addTask("EWO 增强导表",2400,()=>{ toast("EWO 增强导表完成"); return `EWO增强_${p.code}.xlsx`; }); toast("已提交","进度可以在「任务」里看"); break;
    case "tool-tab": S.sub.tools=arg; render(); break;
    case "x-pick": xFiles.push(["一车间BOM.xlsx","二车间BOM.xlsx","供应商清单_10月.xlsx","供应商清单_9月.xlsx"][xFiles.length%4]); render(); break;
    case "x-rm": xFiles.splice(+arg,1); render(); break;
    case "x-op": xOp=arg; render(); break;
    case "x-run": { const op=xOp; const t=addTask(`Excel ${op}：${xFiles.length} 个文件`,2800,()=>{ toast(`Excel ${op}完成`,"",[{label:"打开结果",run:()=>toast("（演示）已用 Excel 打开")}]); return `${op}结果_${TODAY}.xlsx`; },"Excel"); xTaskId=String(t.id); xFiles=[]; render(); break; }
    case "arch-toggle": { const a=S.archive.find(x=>x.id===+arg); a.on=!a.on; render(); break; }
    case "arch-run": { const a=S.archive.find(x=>x.id===+arg); addTask(`归档：${a.name}`,2000,()=>{ a.last=nowStr()+" ✓"; render(); return null; }); break; }
    case "arch-new": S.archive.push({id:Date.now(),name:"新的归档任务",on:true,freq:"每天 07:00",last:"未运行",dir:"默认目录"}); render(); break;
    case "raw-run": toast("（专家）已发送请求","返回 128 条，已脱敏保存 XML"); break;
    case "set-tab": S.sub.settings=arg; render(); break;
    case "expert": S.expert=!S.expert; if(!S.expert&&S.sub.settings==="advanced") S.sub.settings="account"; if(!S.expert&&S.sub.tools==="raw") S.sub.tools="excel"; render(); toast(S.expert?"专家模式已开启":"专家模式已关闭", S.expert?"「工具」里多了原始系统查询，同步设置里多了更新方式和审计":""); break;
    case "autostart": S.autostart=!S.autostart; render(); break;
    case "logout": S.savePwd=false; S.sessionExpired=true; render(); toast("已退出并清除保存的密码"); break;
    case "relogin": openLogin(); break;
    case "do-relogin": S.sessionExpired=false; p.deliverables.forEach(d=>{ if(d.error&&/登录/.test(d.error)) d.error=null; }); closeLayer(); render(); toast("登录成功","正在补跑错过的同步"); addTask("补跑错过的同步",2000,()=>{ S.lastBg=nowStr(); render(); }); break;
    case "pick-folder": toast("（演示）会打开 Windows 选择文件夹对话框"); break;
    case "saved": toast("已保存"); break;
    case "rollup-add": { const a=$("#ruA").value.trim(); if(a){ S.rollup.push([a,$("#ruB").value]); render(); } break; }
    case "rollup-rm": S.rollup.splice(+arg,1); render(); break;
    case "diag": toast("诊断包已导出","已保存到桌面：VSE诊断包_20261028.zip（不含密码和 Cookie），可以直接发给支持人员"); break;
    case "pkg-pick": openUpdate({name:"签署日报",ver:"0.3.1",notes:"修复：周末不再计入停留天数；邮件里的图表更清晰",size:"46 KB",target:"签署日报"}); break;
    case "discover-toggle": S.discoverOn=!S.discoverOn; render(); break;
    case "wdir-add": S.watchDirs=(S.watchDirs||["下载"]).concat(["D:\\我的文档\\接收的文件"]); render(); toast("（演示）会打开 Windows 选择文件夹对话框","已添加示例文件夹"); break;
    case "wdir-rm": S.watchDirs.splice(+arg,1); render(); break;
    case "install-update": openUpdate(S.pendingUpdate); break;
    case "do-update": { const pkg=layer.pkg; closeLayer(); splash("正在安装更新并重启…",2600,()=>{
        if(pkg.bad){ S.history.unshift({t:nowStr(), text:`${pkg.name} ${pkg.ver} 启动检查未通过，已自动回到 ${S.version.packs[pkg.target]||S.version.app}`, tone:"bad"}); S.pendingUpdate=null; render(); toast("更新没有成功，已自动恢复","程序已回到之前的版本，你的数据没有变化。原因已记录在「更新记录」里。"); return; }
        const prev = pkg.target==="app"? S.version.app : S.version.packs[pkg.target];
        if(pkg.target==="app") S.version.app=pkg.ver; else S.version.packs[pkg.target]=pkg.ver;
        S.history.unshift({t:nowStr(), text:`${pkg.name} ${prev} → ${pkg.ver}：${pkg.notes}`, tone:"ok", rollback:true, target:pkg.target, prev});
        S.pendingUpdate=null; render(); toast(`已更新到 ${pkg.name} ${pkg.ver}`, pkg.notes); }); break; }
    case "rollback": { const h=S.history[+arg]; closeLayer(); splash("正在回滚并重启…",2000,()=>{ if(h.target==="app") S.version.app=h.prev; else S.version.packs[h.target]=h.prev; h.rollback=false; S.history.unshift({t:nowStr(),text:`已回滚 ${h.target==="app"?"VSE Toolbox":h.target} 到 ${h.prev}`,tone:"ok"}); render(); toast("已回滚",`回到 ${h.prev}，数据保持不变`); }); break; }
    case "open-file": toast("（演示）已打开", el.dataset.file||"文件"); break;
    case "task-cancel": { const t=S.tasks.find(x=>String(x.id)===arg); t.state="已取消"; openTasks(); refreshLive(); break; }
    case "task-retry": { const t=S.tasks.find(x=>String(x.id)===arg); S.tasks=S.tasks.filter(x=>x!==t); addTask(t.name,2000,()=>null,t.kind); openTasks(); break; }
    /* 向导 */
    case "wz-import": wz.importOld=!wz.importOld; openWizard(); break;
    case "wz-back": wz.step--; wz.err=""; openWizard(); break;
    case "wz-next":
      if(wz.step===1){ wz.busy=true; openWizard(); setTimeout(()=>{ wz.busy=false; if(wz.pwd.length<2){ wz.err="密码不对，请再试一次（演示中至少输入 2 个字符）"; openWizard(); return; } wz.err=""; wz.step++; openWizard(); },900); break; }
      if(wz.step===4){ finishWizard(); break; }
      wz.step++; openWizard(); break;
    case "wz-sec": { const i=wz.secs.indexOf(arg); i>=0?wz.secs.splice(i,1):wz.secs.push(arg); openWizard(); break; }
    case "wz-pick": { const i=wz.picks.indexOf(arg); i>=0?wz.picks.splice(i,1):wz.picks.push(arg); openWizard(); break; }
    case "wz-auto": wz.autostart=!wz.autostart; openWizard(); break;
    /* 演示控制台 */
    case "demo-reset": try{localStorage.removeItem("vse-v2-demo");}catch(_){} location.reload(); break;
    case "demo-expire": if(S.firstRun) break; S.sessionExpired=true; render(); toast("VSE Toolbox：需要重新登录","登录已过期，后台同步已暂停",[{label:"重新登录",run:()=>{ S.hidden=false; render(); openLogin(); }}]); break;
    case "demo-discover": if(S.firstRun) break; if(!S.discoverOn){ toast("自动发现已关闭","请在「设置 → 关于与更新」中开启，或者把更新包拖进窗口"); break; }
      S.pendingUpdate={name:"VSE Toolbox",ver:"2.0.4",notes:"首页加载更快；修复项目切换后日报科室没有刷新的问题",size:"0.9 MB",target:"app"}; render();
      toast("发现更新：VSE Toolbox 2.0.4","在「下载」文件夹里找到了 vse-app-2.0.4.vsepkg（签名有效）",[{label:"立即更新",run:()=>{ S.hidden=false; render(); openUpdate(S.pendingUpdate); }},{label:"稍后",run:()=>{}}]); break;
    case "demo-badupdate": if(S.firstRun) break; openUpdate({name:"TIR 简表",ver:"0.3.0-测试",notes:"（演示用：这个版本会启动失败）",size:"38 KB",target:"TIR 简表",bad:true}); break;
    case "demo-syncfail": if(S.firstRun) break; { const d=p.deliverables.find(x=>x.key==="ncrp")||p.deliverables[0]; d.enabled=true; d.verified=true; d.error="Aras 服务器在 30 秒内没有响应（可能是内网繁忙）"; d.lastRun=nowStr(); render(); toast(`${d.name} 同步失败`,"已放到「今天」的待处理里",[{label:"查看",run:()=>{ S.hidden=false; go("today"); }}]); break; }
  }
});
document.addEventListener("input", e=>{
  const k=e.target.dataset.input; if(!k) return; const v=e.target.value;
  if(k==="wz-user"){ wz.user=v; syncWzBtn(); } else if(k==="wz-pwd"){ wz.pwd=v; syncWzBtn(); } else if(k==="wz-code") wz.code=v;
  else if(k==="grid-q"){ gridState.q=v; gridState.page=0; clearTimeout(window._gq); window._gq=setTimeout(()=>{ openDeliv(layer.id); const i=$('[data-input="grid-q"]'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length);} },250); }
  else if(k==="f-veh-add"){ const all=VEHICLES.concat(PLATFORMS); if(all.includes(v)){ const d=P().deliverables.find(x=>x.id===layer.id); if(!d.filter.vehicles.includes(v)) d.filter.vehicles.push(v); openDeliv(layer.id,"sync"); } }
  else if(k.startsWith("f-")){ const d=P().deliverables.find(x=>x.id===layer.id); if(k==="f-from") d.filter.from=v; if(k==="f-to") d.filter.to=v; }
});
function syncWzBtn(){ const b=$('[data-act="wz-next"]'); if(b) b.disabled=!(wz.user&&wz.pwd); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && layer.kind && layer.kind!=="wizard") closeLayer(); });
/* 拖放更新包到窗口任意位置 */
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); const d=$("#pkgDrop")||$("#drop"); if(d) d.classList.add("over"); }));
document.addEventListener("dragleave",()=>document.querySelectorAll(".drop.over").forEach(d=>d.classList.remove("over")));
document.addEventListener("drop", e=>{ e.preventDefault(); document.querySelectorAll(".drop.over").forEach(d=>d.classList.remove("over"));
  const f=[...(e.dataTransfer?.files||[])]; if(!f.length||S.firstRun) return;
  const pkg=f.find(x=>/\.vsepkg$/i.test(x.name)); const xl=f.filter(x=>/\.xlsx?$/i.test(x.name));
  if(pkg) openUpdate({name:pkg.name.replace(/\.vsepkg$/i,""),ver:"新版本",notes:"（演示）真实版本会显示包里的更新说明",size:Math.ceil(pkg.size/1024)+" KB",target:"app"});
  else if(xl.length){ xFiles.push(...xl.map(x=>x.name)); S.page="tools"; S.sub.tools="excel"; render(); }
  else toast("不认识这个文件","可以拖入 .vsepkg 更新包，或者 Excel 文件");
});
/* 托盘 */
let trayMenu=false;
function closeTray(){ trayMenu=false; const m=$(".tray-menu"); if(m) m.remove(); }
$("#tray").addEventListener("click", e=>{
  e.stopPropagation(); if(trayMenu){ closeTray(); return; } trayMenu=true;
  const m=document.createElement("div"); m.className="tray-menu";
  m.innerHTML=`<button data-t="open">打开 VSE Toolbox</button><button data-t="sync">立即同步</button><button data-t="upd">更新记录</button><hr style="border:0;border-top:1px solid #45403c;margin:4px"><button data-t="quit">退出</button>`;
  m.addEventListener("click", ev=>{ const t=ev.target.dataset.t; closeTray(); if(S.firstRun && t!=="open") return;
    if(t==="open"){ S.hidden=false; render(); }
    if(t==="sync"){ addTask("同步全部交付物",2000,()=>{ S.lastBg=nowStr(); render(); toast("同步完成","没有发现异常"); },"同步"); toast("已开始同步"); }
    if(t==="upd"){ S.hidden=false; go("settings","about"); }
    if(t==="quit"){ toast("确定要退出吗？","退出后不会再自动同步数据和生成日报",[{label:"仍然退出",run:()=>{ S.hidden=true; render(); toast("（演示）程序已退出","双击桌面图标可以重新打开"); }},{label:"保留在后台",run:()=>{}}]); }
  });
  document.body.appendChild(m);
});
function runSign(fresh){
  const t=addTask(fresh?"刷新 TDC 数据并生成签署日报":"生成签署日报", fresh?3000:1000, ()=>{ signOut=true; S.reportDone=true; render(); toast("签署日报已生成","可以复制正文或生成邮件草稿"); return null; });
  signTaskId=String(t.id); render();
}

render();
</script>
</body>
</html>
