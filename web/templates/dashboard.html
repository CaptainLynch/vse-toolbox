<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSE Toolbox 控制台</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/host/base.css?v=20261001" />
  <link rel="stylesheet" href="/static/host/host.css?v=20261001" />
  <link rel="stylesheet" href="/static/diagnostics.css?v=1" />
</head>
<body data-theme="light" data-session-view="plugin">
  <div class="app-shell">
    <div id="host-chrome" data-version="{{ app_version|default('开发工作区', true) }}"></div>

    <main class="workspace">
      <div class="workspace-head">
        <div>
          <p class="eyebrow">项目工作台</p>
          <h2 id="session-title">VSE Toolbox</h2>
        </div>
      </div>

      <section id="plugin-host" class="panel-section plugin-host" aria-live="polite" aria-label="插件页面"></section>
      <noscript><p>VSE Toolbox 需要启用 JavaScript。</p></noscript>
    </main>
  </div>
  <script src="/static/diagnostics.js?v=1"></script>
  <script src="/static/ewo-enrichment.js?v=20260916"></script>
  <script type="module" src="/static/host/shell.js?v=20261001"></script>

</html>
