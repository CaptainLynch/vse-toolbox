<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSE Toolbox 控制台</title>
  <link rel="stylesheet" href="/static/style.css?v=ephemeral-test-session-20260723" />
</head>
<body data-theme="light" data-session-view="overview" data-current-command="ewo" data-test-session-enabled="{{ 'true' if config.get('EPHEMERAL_TEST_SESSION_ENABLED', false) else 'false' }}">
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">V</div>
        <div>
          <p class="eyebrow">本地操作</p>
          <h1>VSE Toolbox</h1>
        </div>
        <span class="version-chip">v0.1</span>
      </div>

      <nav class="workspace-tabs" aria-label="工作区导航">
        <a href="#overview" class="active" data-panel-link="overview">概览</a>
        <a href="#aras-panel" data-panel-link="aras-panel">Aras</a>
        <span class="disabled" aria-disabled="true">设置</span>
      </nav>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
        <span id="theme-label">浅色</span>
      </button>
    </header>

    <main class="workspace">
      <div class="workspace-head">
        <div>
          <p class="eyebrow">工作台</p>
          <h2 id="session-title">工作台概览</h2>
        </div>
        <div class="command-chip"><span id="command-label">就绪</span></div>
      </div>

      <section id="overview" class="panel-section overview-grid" aria-label="工作台概览">
        <article class="metric-card">
          <div class="card-head">
            <p class="eyebrow">项目</p>
            <h3>项目状态</h3>
          </div>
          <div class="metric-body" id="projects-body"><p class="loading">加载中</p></div>
        </article>

        <article class="metric-card">
          <div class="card-head">
            <p class="eyebrow">交付</p>
            <h3>交付物流转</h3>
          </div>
          <div class="metric-body" id="deliverables-body"><p class="loading">加载中</p></div>
        </article>

        <article class="metric-card">
          <div class="card-head">
            <p class="eyebrow">同步</p>
            <h3>飞书同步</h3>
          </div>
          <div class="metric-body" id="feishu-body"><p class="loading">加载中</p></div>
        </article>
      </section>

      <section id="aras-panel" class="panel-section aras-workbench" hidden aria-label="Aras 工具">
        <div class="aras-head">
          <div>
            <p class="eyebrow">Aras</p>
            <h3>Aras 查询工具</h3>
          </div>
          <div class="mode-toolbar" role="tablist" aria-label="Aras 查询模式">
            <button type="button" class="segment active" data-aras-mode="ewo">EWO</button>
            <button type="button" class="segment" data-aras-mode="paa">PAA</button>
            <button type="button" class="segment" data-aras-mode="ncr-progress">NCR 进度</button>
            <button type="button" class="segment" data-aras-mode="ncr-detail">NCR 明细</button>
          </div>
        </div>

        <form id="aras-form" class="aras-form" autocomplete="off">
          <section class="form-block connection-block">
            <div class="block-title">
              <p class="eyebrow">连接</p>
              <h4>请求上下文</h4>
            </div>
            <div class="form-grid">
              <label>
                <span>Base URL</span>
                <input id="aras-base-url" name="base_url" type="url" required placeholder="https://aras-host/" />
              </label>
              <label data-password-auth-field>
                <span>用户名</span>
                <input id="aras-username" name="username" autocomplete="off" autocapitalize="none" spellcheck="false" />
              </label>
              <label data-password-auth-field>
                <span>密码</span>
                <input id="aras-password" name="password" type="password" autocomplete="off" />
              </label>
              <label class="insecure-http-confirm wide" data-password-auth-field>
                <input id="aras-allow-insecure-http" name="allow_insecure_http" type="checkbox" />
                <span>我已了解 HTTP 会明文传输凭据，仅授权本次请求访问当前 Aras 地址</span>
              </label>
              <label data-compat-auth-field hidden>
                <span>Cookie（备用）</span>
                <input id="aras-cookie" name="cookie" type="password" autocomplete="off" />
              </label>
              <label class="wide" data-compat-auth-field hidden>
                <span>请求头（备用）</span>
                <textarea id="aras-headers" name="headers" rows="3" placeholder="名称: 值"></textarea>
              </label>
            </div>
          </section>

          <section class="form-block fields-block">
            <div class="block-title">
              <p class="eyebrow">筛选</p>
              <h4>查询字段</h4>
            </div>
            <div class="aras-fields" data-mode-fields="ewo">
              <label><span>EWO 编号</span><input name="ewo_no" /></label>
              <label><span>项目代码</span><input name="project_code" /></label>
              <label><span>主题关键词</span><input name="subject_keyword" /></label>
              <label><span>变更类型</span><input name="change_type" /></label>
              <label><span>变更子类型</span><input name="change_sub_type" /></label>
              <label><span>区域</span><input name="area" /></label>
              <label><span>状态</span><input name="state" /></label>
              <label><span>响应部门（包含）</span><input name="rsp_department_keyword" /></label>
              <label><span>车型（包含）</span><input name="model_keyword" /></label>
              <label><span>提交开始</span><input name="submit_start" type="date" /></label>
              <label><span>提交结束</span><input name="submit_end" type="date" /></label>
            </div>

            <div class="aras-fields" data-mode-fields="paa" hidden>
              <label><span>PAA 编号</span><input name="paa_no" /></label>
              <label><span>EWO 编号</span><input name="ewo_no" /></label>
              <label><span>状态</span><input name="state" /></label>
              <label><span>区域</span><input name="area" /></label>
              <label><span>基地</span><input name="base" /></label>
              <label><span>部门（包含 PE/TDC 部门或申请人部门）</span><input name="department_keyword" /></label>
              <label><span>车型（包含）</span><input name="vehicle_keyword" /></label>
              <label><span>提交开始</span><input name="submit_start" type="date" /></label>
              <label><span>提交结束</span><input name="submit_end" type="date" /></label>
              <label><span>物料需求开始</span><input name="mtl_rq_start" type="date" /></label>
              <label><span>物料需求结束</span><input name="mtl_rq_end" type="date" /></label>
            </div>

            <div class="aras-fields" data-mode-fields="ncr" hidden>
              <label><span>采购开始</span><input name="buy_start" type="date" /></label>
              <label><span>采购结束</span><input name="buy_end" type="date" /></label>
              <label><span>PE 开始</span><input name="pe_start" type="date" /></label>
              <label><span>PE 结束</span><input name="pe_end" type="date" /></label>
              <label><span>NCR 编号</span><input name="ncr_no" /></label>
              <label><span>项目名称</span><input name="project_names" /></label>
              <label><span>区段代码</span><input name="section_code" /></label>
              <label><span>变更类型</span><input name="change_type" /></label>
              <label><span>其他条件</span><input name="othercondition" value="0" /></label>
            </div>
          </section>

          <section class="form-block actions-block">
            <button id="aras-submit" class="primary-btn" type="submit">筛选后全量导出</button>
            <button id="aras-cancel" class="cancel-btn" type="button" hidden>取消导出</button>
            <span id="aras-status" aria-live="polite"></span>
          </section>
        </form>

        <section id="test-session-panel" class="test-session-panel" hidden aria-label="本轮测试会话">
          <div class="test-session-head">
            <div>
              <p class="eyebrow">本地测试</p>
              <h4>本轮测试会话</h4>
            </div>
            <span class="test-session-note">仅存在于当前本地进程，到期自动清除</span>
          </div>
          <div class="test-session-actions">
            <button id="test-session-seed" class="segment" type="button">保存本轮测试信息</button>
            <button id="test-session-export" class="primary-btn" type="button" disabled>直接执行本轮测试</button>
            <button id="test-session-clear" class="segment" type="button">清除本轮信息</button>
          </div>
          <div id="test-session-error" class="error-msg" hidden aria-live="polite"></div>
          <div id="test-session-status" class="test-session-status" aria-live="polite">尚未保存本轮测试信息</div>
        </section>

        <section class="result-panel" aria-live="polite">
          <div class="result-head">
            <p class="eyebrow">结果</p>
            <span id="result-kind">就绪</span>
          </div>
          <div id="aras-error" class="error-msg" hidden></div>
          <div id="aras-result" class="is-empty">暂无结果</div>
        </section>
      </section>
    </main>
  </div>
  <script src="/static/app.js?v=scheme-a-export-jobs-20260728"></script>
</body>
</html>
