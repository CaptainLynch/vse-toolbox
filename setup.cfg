[flake8]
# VSE TOOLBOX - flake8 config
max-line-length = 120
# Exclude data directories and caches
exclude =
    .git,
    __pycache__,
    data/,
    poc/,
    build/,
    dist/
# Ignore common noise rules
ignore =
    # E501: line too long (controlled by max-line-length)
    E501,
    # W503: line break before binary operator (PEP 8)
    W503,
    # E203: whitespace before ':' (black format conflict)
    E203
# Per-file ignores
per-file-ignores =
    # Allow unused imports in __init__.py
    */__init__.py:F401
    # main.py sys.path mutation import order
    main.py:E402
    # web/app.py frozen/source root bootstrap
    web/app.py:E402

[mypy]
# VSE TOOLBOX - mypy config
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
# Ignore third-party missing stubs
ignore_missing_imports = True
# Exclude data directories
exclude = data/|poc/|build/

[tool:pytest]
testpaths = tests
norecursedirs = .git .runtime .zcode .excel_workbench artifacts dist dist-probe tmp poc .agents
