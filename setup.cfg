[flake8]
# VSE TOOLBOX — flake8 配置
max-line-length = 120
# 排除数据目录和缓存
exclude =
    .git,
    __pycache__,
    data/,
    poc/,
    build/,
    dist/
# 忽略常见噪音规则
ignore =
    # E501: 行过长（已通过 max-line-length 控制）
    E501,
    # W503: 空行前的换行符（PEP 8 已不再推荐此规则）
    W503,
    # E203: 冒号前的空格（与 black 格式化冲突）
    E203
# 中文注释兼容
per-file-ignores =
    # 允许 __init__.py 中的未使用导入
    */__init__.py:F401

[mypy]
# VSE TOOLBOX — mypy 配置
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
# 忽略缺失类型标注的第三方库
ignore_missing_imports = True
# 排除数据目录
exclude = data/|poc/|build/
