# VSE_TOOLBOX 项目级 Codex 配置
# 仅在 VSE_TOOLBOX 目录下生效，覆盖全局默认值

model = "mimo-v2.5-pro"
model_reasoning_effort = "medium"

[agents.architect]
description = "VSE TOOLBOX 功能设计师：新功能需求分析、架构设计、接口定义"
config_file = ".codex/agents/architect.toml"

[agents.worker]
description = "VSE TOOLBOX 维护工程师：Bug修复、小功能调整、代码修改"
config_file = ".codex/agents/worker.toml"

[agents.reviewer]
description = "VSE TOOLBOX 审计官：代码审计、安全审查、GAC合规检查"
config_file = ".codex/agents/reviewer.toml"

[agents.explorer]
description = "VSE TOOLBOX 探索员：代码浏览、定位、结构理解"
config_file = ".codex/agents/explorer.toml"

[agents.monitor]
description = "VSE TOOLBOX 测试工程师：测试执行、验证监控"
config_file = ".codex/agents/monitor.toml"
